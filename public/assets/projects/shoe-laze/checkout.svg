<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#141424" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161626" />
      <stop offset="100%" stop-color="#0e0e18" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg3)" />

  <!-- App Window Frame -->
  <rect x="40" y="30" width="1120" height="615" rx="16" fill="#12121e" stroke="#2a2a40" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="30" width="1120" height="48" rx="16" fill="#18182a" />
  <circle cx="70" cy="54" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="92" cy="54" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="114" cy="54" r="6" fill="#22c55e" opacity="0.8" />
  
  <rect x="360" y="42" width="480" height="24" rx="6" fill="#0c0c14" stroke="#252538" />
  <text x="600" y="58" fill="#8888aa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">shoelaze.in/checkout — Razorpay Secure Flow</text>

  <!-- Left: Order Summary -->
  <g transform="translate(80, 110)">
    <rect width="500" height="500" rx="16" fill="url(#panelGrad)" stroke="#25253c" />
    <text x="30" y="45" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="700">Order Summary</text>
    <text x="30" y="70" fill="#888899" font-family="Inter, sans-serif" font-size="13">Review your items before proceeding</text>

    <!-- Item 1 -->
    <g transform="translate(30, 100)">
      <rect width="70" height="70" rx="10" fill="#0c0c16" stroke="#252538" />
      <text x="35" y="40" fill="#00d4ff" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">👟</text>
      <text x="90" y="30" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="600">Air Pulse Matrix</text>
      <text x="90" y="52" fill="#888899" font-family="Inter, sans-serif" font-size="13">Size: UK 9 · Qty: 1</text>
      <text x="400" y="40" fill="#00d4ff" font-family="Inter, sans-serif" font-size="16" font-weight="700">₹3,499</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(30, 190)">
      <rect width="70" height="70" rx="10" fill="#0c0c16" stroke="#252538" />
      <text x="35" y="40" fill="#7c3aed" font-family="Inter, sans-serif" font-size="20" text-anchor="middle">👟</text>
      <text x="90" y="30" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="600">Shoe Laze Classic Socks (3-pack)</text>
      <text x="90" y="52" fill="#888899" font-family="Inter, sans-serif" font-size="13">Black / White / Grey · Qty: 1</text>
      <text x="400" y="40" fill="#00d4ff" font-family="Inter, sans-serif" font-size="16" font-weight="700">₹499</text>
    </g>

    <line x1="30" y1="290" x2="470" y2="290" stroke="#222238" stroke-width="1" />

    <!-- Breakdown -->
    <g transform="translate(30, 320)" font-family="Inter, sans-serif" font-size="14" fill="#888899">
      <text x="0" y="0">Subtotal</text>
      <text x="440" y="0" fill="#ffffff" text-anchor="end">₹3,998</text>
      
      <text x="0" y="30">Shipping (Express Courier)</text>
      <text x="440" y="30" fill="#22c55e" text-anchor="end">FREE</text>

      <text x="0" y="60">GST (Included)</text>
      <text x="440" y="60" fill="#8888aa" text-anchor="end">₹719</text>
    </g>

    <line x1="30" y1="410" x2="470" y2="410" stroke="#222238" stroke-width="1" />

    <text x="30" y="450" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700">Total Payable</text>
    <text x="470" y="450" fill="#00d4ff" font-family="Inter, sans-serif" font-size="24" font-weight="800" text-anchor="end">₹3,998</text>
  </g>

  <!-- Right: Razorpay Payment Card -->
  <g transform="translate(620, 110)">
    <rect width="500" height="500" rx="16" fill="url(#panelGrad)" stroke="#00d4ff" stroke-width="1.5" />
    
    <rect x="30" y="25" width="130" height="28" rx="6" fill="#00d4ff" opacity="0.15" />
    <text x="95" y="44" fill="#00d4ff" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RAZORPAY SECURE</text>

    <text x="30" y="85" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="700">Select Payment Method</text>
    <text x="30" y="110" fill="#888899" font-family="Inter, sans-serif" font-size="13">256-bit encrypted checkout gateway</text>

    <!-- Payment Option 1: UPI -->
    <g transform="translate(30, 135)">
      <rect width="440" height="60" rx="12" fill="#1b1b30" stroke="#00d4ff" stroke-width="2" />
      <circle cx="35" cy="30" r="10" fill="#00d4ff" />
      <circle cx="35" cy="30" r="4" fill="#0a0a0f" />
      <text x="65" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="600">UPI Instant Pay</text>
      <text x="65" y="48" fill="#8888aa" font-family="Inter, sans-serif" font-size="12">Google Pay, PhonePe, Paytm, CRED</text>
      <text x="415" y="36" fill="#22c55e" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="end">FASTEST</text>
    </g>

    <!-- Payment Option 2: Cards -->
    <g transform="translate(30, 210)">
      <rect width="440" height="60" rx="12" fill="#121220" stroke="#2a2a40" />
      <circle cx="35" cy="30" r="10" fill="#252538" />
      <text x="65" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="600">Credit / Debit Cards</text>
      <text x="65" y="48" fill="#8888aa" font-family="Inter, sans-serif" font-size="12">Visa, MasterCard, RuPay, Amex</text>
    </g>

    <!-- Payment Option 3: Netbanking -->
    <g transform="translate(30, 285)">
      <rect width="440" height="60" rx="12" fill="#121220" stroke="#2a2a40" />
      <circle cx="35" cy="30" r="10" fill="#252538" />
      <text x="65" y="28" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="600">Netbanking</text>
      <text x="65" y="48" fill="#8888aa" font-family="Inter, sans-serif" font-size="12">All major Indian banks supported</text>
    </g>

    <!-- Pay Button -->
    <g transform="translate(30, 375)">
      <rect width="440" height="52" rx="12" fill="#00d4ff" />
      <text x="220" y="32" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Pay ₹3,998 via Razorpay →</text>
    </g>

    <text x="250" y="465" fill="#666680" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">🔒 Verified 100% Secure Transaction by Razorpay</text>
  </g>
</svg>
