<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#141424" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19192c" />
      <stop offset="100%" stop-color="#10101c" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg2)" />

  <!-- App Window Frame -->
  <rect x="40" y="30" width="1120" height="615" rx="16" fill="#12121e" stroke="#2a2a40" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="40" y="30" width="1120" height="48" rx="16" fill="#18182a" />
  <circle cx="70" cy="54" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="92" cy="54" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="114" cy="54" r="6" fill="#22c55e" opacity="0.8" />
  
  <rect x="360" y="42" width="480" height="24" rx="6" fill="#0c0c14" stroke="#252538" />
  <text x="600" y="58" fill="#8888aa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">shoelaze.in/collections — Footwear Catalog &amp; Filters</text>

  <!-- Page Title & Category Tabs -->
  <text x="80" y="125" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="800">Explore Collection</text>
  <text x="80" y="148" fill="#888899" font-family="Inter, sans-serif" font-size="13">Showing 24 performance and lifestyle sneakers</text>

  <!-- Filter Pills -->
  <g transform="translate(80, 165)">
    <rect width="70" height="32" rx="8" fill="#00d4ff" />
    <text x="35" y="20" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">All (24)</text>

    <rect x="80" y="0" width="90" height="32" rx="8" fill="#1a1a2c" stroke="#33334d" />
    <text x="125" y="20" fill="#aaaaaa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Running (8)</text>

    <rect x="180" y="0" width="105" height="32" rx="8" fill="#1a1a2c" stroke="#33334d" />
    <text x="232" y="20" fill="#aaaaaa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Streetwear (10)</text>

    <rect x="295" y="0" width="90" height="32" rx="8" fill="#1a1a2c" stroke="#33334d" />
    <text x="340" y="20" fill="#aaaaaa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Casual (6)</text>
  </g>

  <!-- 3 Product Cards Grid -->
  <!-- Card 1 -->
  <g transform="translate(80, 220)">
    <rect width="320" height="380" rx="16" fill="url(#cardGrad)" stroke="#2a2a44" stroke-width="1.5" />
    <rect x="16" y="16" width="288" height="200" rx="12" fill="#0c0c16" />
    
    <!-- Mini Sneaker Graphic -->
    <path d="M 60,150 Q 120,140 180,130 Q 240,120 260,110 C 270,105 250,85 220,80 L 170,80 Q 140,55 110,40 L 80,75 Z" fill="#00d4ff" opacity="0.8" />
    <path d="M 50,150 Q 150,145 270,120 L 265,135 Q 150,165 50,158 Z" fill="#7c3aed" />
    
    <text x="20" y="248" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700">Air Pulse Matrix</text>
    <text x="20" y="270" fill="#888899" font-family="Inter, sans-serif" font-size="13">Responsive cushioning</text>
    <text x="20" y="310" fill="#00d4ff" font-family="Inter, sans-serif" font-size="20" font-weight="800">₹3,499</text>
    <rect x="180" y="285" width="124" height="36" rx="8" fill="#00d4ff" />
    <text x="242" y="308" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Add to Bag</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(440, 220)">
    <rect width="320" height="380" rx="16" fill="url(#cardGrad)" stroke="#2a2a44" stroke-width="1.5" />
    <rect x="16" y="16" width="288" height="200" rx="12" fill="#0c0c16" />
    
    <!-- Mini Sneaker Graphic 2 -->
    <path d="M 60,150 Q 120,140 180,130 Q 240,120 260,110 C 270,105 250,85 220,80 L 170,80 Q 140,55 110,40 L 80,75 Z" fill="#7c3aed" opacity="0.8" />
    <path d="M 50,150 Q 150,145 270,120 L 265,135 Q 150,165 50,158 Z" fill="#00d4ff" />

    <text x="20" y="248" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700">Cyber Velocity Pro</text>
    <text x="20" y="270" fill="#888899" font-family="Inter, sans-serif" font-size="13">High-grip rubber sole</text>
    <text x="20" y="310" fill="#00d4ff" font-family="Inter, sans-serif" font-size="20" font-weight="800">₹4,199</text>
    <rect x="180" y="285" width="124" height="36" rx="8" fill="#00d4ff" />
    <text x="242" y="308" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Add to Bag</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(800, 220)">
    <rect width="320" height="380" rx="16" fill="url(#cardGrad)" stroke="#2a2a44" stroke-width="1.5" />
    <rect x="16" y="16" width="288" height="200" rx="12" fill="#0c0c16" />
    
    <!-- Mini Sneaker Graphic 3 -->
    <path d="M 60,150 Q 120,140 180,130 Q 240,120 260,110 C 270,105 250,85 220,80 L 170,80 Q 140,55 110,40 L 80,75 Z" fill="#22c55e" opacity="0.8" />
    <path d="M 50,150 Q 150,145 270,120 L 265,135 Q 150,165 50,158 Z" fill="#00d4ff" />

    <text x="20" y="248" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="700">Urban Drift Low</text>
    <text x="20" y="270" fill="#888899" font-family="Inter, sans-serif" font-size="13">Minimalist daily wear</text>
    <text x="20" y="310" fill="#00d4ff" font-family="Inter, sans-serif" font-size="20" font-weight="800">₹2,899</text>
    <rect x="180" y="285" width="124" height="36" rx="8" fill="#00d4ff" />
    <text x="242" y="308" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Add to Bag</text>
  </g>
</svg>
