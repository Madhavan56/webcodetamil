<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12" />
      <stop offset="100%" stop-color="#141424" />
    </linearGradient>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181828" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10101c" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="shoe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />
  
  <!-- Ambient glow behind sneaker -->
  <circle cx="820" cy="340" r="220" fill="#00d4ff" opacity="0.12" filter="url(#glow)" />
  <circle cx="880" cy="380" r="180" fill="#7c3aed" opacity="0.15" filter="url(#glow)" />

  <!-- App Window Frame -->
  <rect x="40" y="30" width="1120" height="615" rx="16" fill="#12121e" stroke="#2a2a40" stroke-width="1.5" />
  
  <!-- Window Header / Browser Bar -->
  <rect x="40" y="30" width="1120" height="48" rx="16" fill="#18182a" />
  <circle cx="70" cy="54" r="6" fill="#ef4444" opacity="0.8" />
  <circle cx="92" cy="54" r="6" fill="#f59e0b" opacity="0.8" />
  <circle cx="114" cy="54" r="6" fill="#22c55e" opacity="0.8" />
  
  <rect x="360" y="42" width="480" height="24" rx="6" fill="#0c0c14" stroke="#252538" />
  <text x="600" y="58" fill="#8888aa" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">shoelaze.in — Premium Footwear Experience</text>

  <!-- Navbar inside Storefront -->
  <text x="80" y="125" fill="#f5f5f5" font-family="Inter, sans-serif" font-size="22" font-weight="800" letter-spacing="1">SHOE<tspan fill="#00d4ff">LAZE</tspan></text>
  
  <g font-family="Inter, sans-serif" font-size="13" fill="#888899">
    <text x="240" y="123" fill="#00d4ff" font-weight="600">New Drops</text>
    <text x="340" y="123">Men</text>
    <text x="400" y="123">Women</text>
    <text x="480" y="123">Collections</text>
    <text x="580" y="123">Store Locator</text>
  </g>
  
  <rect x="1000" y="103" width="120" height="34" rx="8" fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1" />
  <text x="1060" y="125" fill="#00d4ff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cart (2) · ₹4,998</text>

  <!-- Hero Content Left -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#00d4ff" opacity="0.1" stroke="#00d4ff" stroke-width="1" />
    <text x="70" y="17" fill="#00d4ff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">OFFICIAL STOREFRONT</text>

    <text x="0" y="75" fill="#ffffff" font-family="Inter, sans-serif" font-size="44" font-weight="800" line-height="1.1">
      Engineered for
    </text>
    <text x="0" y="125" fill="url(#primary-glow)" font-family="Inter, sans-serif" font-size="44" font-weight="800">
      Peak Performance.
    </text>
    
    <text x="0" y="170" fill="#9999aa" font-family="Inter, sans-serif" font-size="15" width="400">
      Experience comfort crafted for everyday movement and bold style.
    </text>

    <g transform="translate(0, 205)">
      <rect width="160" height="46" rx="10" fill="#00d4ff" />
      <text x="80" y="28" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Explore Drop →</text>

      <rect x="175" y="0" width="180" height="46" rx="10" fill="#1a1a2e" stroke="#33334d" />
      <text x="265" y="28" fill="#f5f5f5" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Visit Store Gallery</text>
    </g>

    <!-- Razorpay Badge -->
    <g transform="translate(0, 280)">
      <rect width="280" height="36" rx="8" fill="#141424" stroke="#252540" />
      <circle cx="20" cy="18" r="6" fill="#22c55e" />
      <text x="36" y="22" fill="#aaaaaa" font-family="Inter, sans-serif" font-size="11" font-weight="500">Secured with Razorpay Integration</text>
    </g>
  </g>

  <!-- Hero Sneaker Illustration Right -->
  <g transform="translate(560, 160)">
    <rect width="520" height="410" rx="20" fill="url(#card-bg)" stroke="#2a2a44" stroke-width="1.5" />
    
    <!-- Stylized Sneaker Shape Graphic -->
    <path d="M 80,310 Q 120,290 200,280 L 320,280 Q 420,280 460,250 C 470,240 450,200 390,190 L 320,190 Q 280,140 230,110 C 190,90 150,110 140,150 L 120,220 Q 80,260 70,290 Z" fill="url(#shoe-grad)" opacity="0.9" filter="url(#glow)" />
    
    <path d="M 90,300 C 150,290 280,290 440,260 C 455,230 380,185 320,185 L 235,115 C 200,105 160,125 150,165 L 130,225 C 100,255 90,280 90,300 Z" fill="#0f0f1c" stroke="#00d4ff" stroke-width="2" />
    
    <!-- Sole -->
    <path d="M 70,300 Q 150,290 300,295 Q 420,300 460,270 L 465,290 Q 380,330 240,325 Q 120,320 65,310 Z" fill="#00d4ff" />
    <path d="M 65,310 Q 120,320 240,325 Q 380,330 465,290 L 460,305 Q 370,345 230,340 Q 110,335 60,320 Z" fill="#7c3aed" />

    <!-- Sneaker details -->
    <path d="M 230,140 L 290,190 M 210,165 L 270,215 M 190,190 L 250,240" stroke="#00d4ff" stroke-width="3" stroke-linecap="round" />
    <circle cx="360" cy="230" r="14" fill="#00d4ff" opacity="0.2" />
    <circle cx="360" cy="230" r="6" fill="#00d4ff" />

    <!-- Floating Price Tag -->
    <rect x="40" y="40" width="150" height="60" rx="12" fill="#141424" stroke="#00d4ff" stroke-width="1.5" />
    <text x="56" y="65" fill="#8888aa" font-family="Inter, sans-serif" font-size="11" font-weight="600">AIR PULSE 01</text>
    <text x="56" y="88" fill="#00d4ff" font-family="Inter, sans-serif" font-size="18" font-weight="800">₹3,499</text>
    <rect x="145" y="55" width="35" height="18" rx="9" fill="#22c55e" opacity="0.2" />
    <text x="162" y="68" fill="#22c55e" font-family="Inter, sans-serif" font-size="10" font-weight="700" text-anchor="middle">NEW</text>
  </g>
</svg>
