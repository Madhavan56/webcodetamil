<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ch1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#ch1-bg)" />

  <!-- Split Screen Divider -->
  <polygon points="640,0 720,0 600,720 520,720" fill="#f59e0b" />
  
  <!-- Left Side: ₹100 Budget Survival -->
  <g transform="translate(60, 100)">
    <rect width="200" height="42" rx="10" fill="#ef4444" />
    <text x="100" y="27" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="900" text-anchor="middle">₹100 BUDGET</text>
    <text x="0" y="140" fill="#ffffff" font-family="Inter, sans-serif" font-size="56" font-weight="900" stroke="#000000" stroke-width="8" paint-order="stroke fill">
      SURVIVING 24H
    </text>
    <text x="0" y="210" fill="#ef4444" font-family="Inter, sans-serif" font-size="64" font-weight="900" stroke="#000000" stroke-width="10" paint-order="stroke fill">
      CHEAP FOOD ONLY!
    </text>
  </g>

  <!-- VS Center Badge -->
  <g transform="translate(610, 360)">
    <circle cx="0" cy="0" r="60" fill="#000000" stroke="#f59e0b" stroke-width="8" />
    <text x="0" y="15" fill="#f59e0b" font-family="Inter, sans-serif" font-size="44" font-weight="900" text-anchor="middle">VS</text>
  </g>

  <!-- Right Side: ₹1,00,000 Luxury Survival -->
  <g transform="translate(740, 100)">
    <rect width="260" height="42" rx="10" fill="#22c55e" />
    <text x="130" y="27" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="18" font-weight="900" text-anchor="middle">₹1,00,000 LUXURY</text>
    <text x="0" y="140" fill="#ffffff" font-family="Inter, sans-serif" font-size="56" font-weight="900" stroke="#000000" stroke-width="8" paint-order="stroke fill">
      5-STAR RESORT
    </text>
    <text x="0" y="210" fill="url(#gold-grad)" font-family="Inter, sans-serif" font-size="64" font-weight="900" stroke="#000000" stroke-width="10" paint-order="stroke fill">
      VIP EXPERIENCE!
    </text>
  </g>

  <!-- Bottom Banner Alert -->
  <g transform="translate(140, 560)">
    <rect width="1000" height="90" rx="24" fill="#000000" stroke="#f59e0b" stroke-width="3" />
    <text x="500" y="56" fill="#ffffff" font-family="Inter, sans-serif" font-size="32" font-weight="900" text-anchor="middle">
      🤯 LAST PERSON TO QUIT WINS ₹50,000 CASH!
    </text>
  </g>
</svg>
