<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ch2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e04" />
      <stop offset="50%" stop-color="#3b1d06" />
      <stop offset="100%" stop-color="#0a0502" />
    </linearGradient>
    <linearGradient id="neon-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4500" />
      <stop offset="50%" stop-color="#ff8c00" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#ch2-bg)" />

  <!-- Mystery Box Graphic in Center-Right -->
  <g transform="translate(740, 160)">
    <circle cx="240" cy="220" r="220" fill="#ff6600" opacity="0.2" filter="blur(40px)" />
    <!-- 3D Isometric Mystery Gift Box -->
    <polygon points="240,60 380,130 240,200 100,130" fill="#ffd700" stroke="#000000" stroke-width="4" />
    <polygon points="100,130 240,200 240,380 100,310" fill="#e65100" stroke="#000000" stroke-width="4" />
    <polygon points="380,130 240,200 240,380 380,310" fill="#ff8f00" stroke="#000000" stroke-width="4" />
    <!-- Giant Question Mark on Box -->
    <text x="240" y="290" fill="#ffffff" font-family="Inter, sans-serif" font-size="120" font-weight="900" text-anchor="middle" stroke="#000000" stroke-width="8" paint-order="stroke fill">?</text>
    <!-- Ribbon Bow -->
    <circle cx="240" cy="130" r="28" fill="#ff0055" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- Big Challenge Typography Left -->
  <g transform="translate(80, 180)">
    <rect x="-10" y="-70" width="220" height="42" rx="10" fill="#ff4500" />
    <text x="100" y="-43" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle">INSANE MYSTERY BOX</text>

    <text x="0" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="78" font-weight="900" stroke="#000000" stroke-width="12" paint-order="stroke fill" letter-spacing="-1">
      I BOUGHT 100
    </text>
    
    <text x="0" y="145" fill="url(#neon-orange)" font-family="Inter, sans-serif" font-size="92" font-weight="900" stroke="#000000" stroke-width="14" paint-order="stroke fill">
      LOST PACKAGES!
    </text>

    <text x="0" y="225" fill="#ffbb33" font-family="Inter, sans-serif" font-size="38" font-weight="800" stroke="#000000" stroke-width="6" paint-order="stroke fill">
      WHAT WAS INSIDE SHOCKED US...
    </text>
  </g>

  <!-- Timer Countdown Stamp -->
  <g transform="translate(80, 560)">
    <rect width="360" height="75" rx="16" fill="#000000" stroke="#ff4500" stroke-width="2" />
    <text x="30" y="46" fill="#ff4500" font-family="Inter, sans-serif" font-size="28" font-weight="900">⏱️ UNBOXING MARATHON</text>
  </g>
</svg>
