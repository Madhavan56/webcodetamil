<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="ent2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="glow-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#ent2-bg)" />

  <!-- Studio Podcasting Microphone Graphic -->
  <g transform="translate(820, 160)">
    <circle cx="180" cy="200" r="220" fill="#38bdf8" opacity="0.15" filter="blur(40px)" />
    <!-- Mic Stand -->
    <line x1="180" y1="280" x2="180" y2="450" stroke="#475569" stroke-width="12" stroke-linecap="round" />
    <ellipse cx="180" cy="460" rx="90" ry="20" fill="#1e293b" stroke="#64748b" stroke-width="4" />
    <!-- Mic Body -->
    <rect x="130" y="100" width="100" height="180" rx="50" fill="#0f172a" stroke="#38bdf8" stroke-width="5" />
    <line x1="130" y1="170" x2="230" y2="170" stroke="#38bdf8" stroke-width="3" />
    <line x1="130" y1="200" x2="230" y2="200" stroke="#38bdf8" stroke-width="3" />
    <!-- On Air Light -->
    <rect x="120" y="30" width="120" height="36" rx="8" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
    <text x="180" y="55" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="900" text-anchor="middle">🔴 ON AIR</text>
  </g>

  <!-- Big Typography Left -->
  <g transform="translate(80, 180)">
    <rect x="-10" y="-70" width="220" height="42" rx="10" fill="#38bdf8" />
    <text x="100" y="-43" fill="#0b132b" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle">EXCLUSIVE PODCAST</text>

    <text x="0" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="78" font-weight="900" stroke="#000000" stroke-width="12" paint-order="stroke fill" letter-spacing="-1">
      HE REVEALED THE
    </text>
    
    <text x="0" y="145" fill="url(#glow-gold)" font-family="Inter, sans-serif" font-size="92" font-weight="900" stroke="#000000" stroke-width="14" paint-order="stroke fill">
      TRUTH ABOUT OTT!
    </text>

    <text x="0" y="225" fill="#93c5fd" font-family="Inter, sans-serif" font-size="38" font-weight="800" stroke="#000000" stroke-width="6" paint-order="stroke fill">
      EPISODE 42 · FULL INTERVIEW 🎙️
    </text>
  </g>

  <!-- Duration Badge Bottom Left -->
  <g transform="translate(80, 560)">
    <rect width="360" height="75" rx="16" fill="#000000" stroke="#38bdf8" stroke-width="2" />
    <text x="30" y="46" fill="#38bdf8" font-family="Inter, sans-serif" font-size="24" font-weight="900">⏱️ 1 HOUR UNFILTERED TALK</text>
  </g>
</svg>
