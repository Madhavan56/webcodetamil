<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="g1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#ffea00" />
    </linearGradient>
    <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#g1-bg)" />

  <!-- Speed Lines / Action Bursts -->
  <path d="M0,0 L400,720 M100,0 L500,720 M800,0 L1280,400 M900,0 L1280,250" stroke="#00d4ff" stroke-width="4" opacity="0.3" stroke-dasharray="10,20" />
  <circle cx="950" cy="360" r="280" fill="#ff0055" opacity="0.25" filter="url(#glow1)" />
  <circle cx="1020" cy="300" r="180" fill="#00d4ff" opacity="0.2" filter="url(#glow1)" />

  <!-- Game Badge / Category Tag -->
  <g transform="translate(60, 60)">
    <rect width="160" height="42" rx="10" fill="#00d4ff" />
    <text x="80" y="27" fill="#0a0a0f" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="1">RANK #1 RADIANT</text>
  </g>

  <!-- Main Headline Typography -->
  <g transform="translate(60, 240)">
    <text x="0" y="0" fill="#ffffff" font-family="Inter, sans-serif" font-size="76" font-weight="900" stroke="#000000" stroke-width="8" paint-order="stroke fill" letter-spacing="-1">
      I PLAYED WITH
    </text>
    <text x="0" y="90" fill="url(#fire-grad)" font-family="Inter, sans-serif" font-size="96" font-weight="900" stroke="#000000" stroke-width="12" paint-order="stroke fill" filter="url(#glow1)">
      1000 FPS!
    </text>
    <text x="0" y="165" fill="#00d4ff" font-family="Inter, sans-serif" font-size="44" font-weight="800" stroke="#000000" stroke-width="6" paint-order="stroke fill">
      (IS THIS EVEN LEGAL?)
    </text>
  </g>

  <!-- Mascot / Character Silhouette Right -->
  <g transform="translate(720, 100)">
    <polygon points="180,40 280,180 380,100 480,300 400,520 120,540 60,320" fill="#0a0a14" stroke="#00d4ff" stroke-width="6" filter="url(#glow1)" />
    <!-- Glowing Visor -->
    <path d="M 220,180 Q 320,160 380,220" stroke="#ff0055" stroke-width="16" stroke-linecap="round" filter="url(#glow1)" />
    <path d="M 220,180 Q 320,160 380,220" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    
    <!-- Neon Accent Lines -->
    <path d="M 160,280 L 260,340 M 140,360 L 240,420" stroke="#00d4ff" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Big Red Arrow -->
  <path d="M 520,440 Q 640,400 700,340 L 680,320 L 750,320 L 740,390 L 715,365 Q 650,420 540,465 Z" fill="#ff0033" stroke="#ffffff" stroke-width="3" filter="url(#glow1)" />

  <!-- Reaction Pill Bottom Left -->
  <g transform="translate(60, 580)">
    <rect width="360" height="70" rx="35" fill="#000000" opacity="0.8" stroke="#ff0055" stroke-width="3" />
    <text x="40" y="44" fill="#ffffff" font-family="Inter, sans-serif" font-size="24" font-weight="800">🔥 99.8% HEADSHOT RATE</text>
  </g>
</svg>
