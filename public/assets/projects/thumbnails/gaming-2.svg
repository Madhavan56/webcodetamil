<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="g2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05141c" />
      <stop offset="50%" stop-color="#0a2a3a" />
      <stop offset="100%" stop-color="#02080d" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#g2-bg)" />

  <!-- Cyber Grid Lines -->
  <g stroke="#00ffff" stroke-width="1.5" opacity="0.15">
    <line x1="0" y1="500" x2="1280" y2="500" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="0" y1="630" x2="1280" y2="630" />
    <line x1="640" y1="400" x2="200" y2="720" />
    <line x1="640" y1="400" x2="450" y2="720" />
    <line x1="640" y1="400" x2="830" y2="720" />
    <line x1="640" y1="400" x2="1080" y2="720" />
  </g>

  <!-- Giant Trophy / Mythic Weapon Center -->
  <circle cx="960" cy="360" r="240" fill="#00d4ff" opacity="0.2" filter="url(#glow2)" />
  
  <g transform="translate(760, 160)">
    <!-- Stylized Mythic Blade / Cyber Katana -->
    <path d="M 50,380 L 320,60 L 350,80 L 100,420 Z" fill="url(#cyan-glow)" filter="url(#glow2)" />
    <path d="M 70,370 L 310,80 L 330,95 L 110,400 Z" fill="#ffffff" />
    <polygon points="40,390 90,440 60,470 10,420" fill="#ffaa00" stroke="#ffffff" stroke-width="2" />
    <!-- Electric Sparks -->
    <path d="M 280,120 L 250,150 L 300,160 L 270,200" stroke="#00ffff" stroke-width="4" fill="none" filter="url(#glow2)" />
    <path d="M 180,240 L 150,270 L 200,280 L 170,320" stroke="#ff007f" stroke-width="4" fill="none" filter="url(#glow2)" />
  </g>

  <!-- Typography Left -->
  <g transform="translate(70, 200)">
    <rect x="-10" y="-80" width="220" height="46" rx="10" fill="#ff0055" />
    <text x="100" y="-50" fill="#ffffff" font-family="Inter, sans-serif" font-size="18" font-weight="900" text-anchor="middle">SECRET UNLOCKED</text>

    <text x="0" y="30" fill="#ffffff" font-family="Inter, sans-serif" font-size="82" font-weight="900" stroke="#000000" stroke-width="10" paint-order="stroke fill">
      ONLY 0.01%
    </text>
    <text x="0" y="130" fill="url(#cyan-glow)" font-family="Inter, sans-serif" font-size="88" font-weight="900" stroke="#000000" stroke-width="12" paint-order="stroke fill" filter="url(#glow2)">
      HAVE THIS ITEM!
    </text>
  </g>

  <!-- Stats Box Bottom Left -->
  <g transform="translate(70, 520)">
    <rect width="460" height="130" rx="20" fill="#080e1a" stroke="#00ffff" stroke-width="2" />
    <text x="30" y="45" fill="#8888aa" font-family="Inter, sans-serif" font-size="16" font-weight="700">TOTAL RARITY SCORE</text>
    <text x="30" y="95" fill="#ffd700" font-family="Inter, sans-serif" font-size="38" font-weight="900">★★★★★ 99,999 DMG</text>
  </g>
</svg>
