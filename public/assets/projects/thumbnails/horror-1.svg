<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="h1-spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0505" />
      <stop offset="70%" stop-color="#0d0202" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="blood-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1a1a" />
      <stop offset="100%" stop-color="#7a0000" />
    </linearGradient>
    <filter id="horrorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#h1-spot)" />

  <!-- Fog & Scratch Texture -->
  <path d="M 0,300 Q 300,200 600,280 T 1280,240 L 1280,720 L 0,720 Z" fill="#150505" opacity="0.6" />
  <line x1="200" y1="40" x2="220" y2="280" stroke="#ff0000" stroke-width="1" opacity="0.3" />
  <line x1="840" y1="80" x2="830" y2="400" stroke="#ff0000" stroke-width="1.5" opacity="0.2" />

  <!-- Creepy Glowing Eyes Center/Right -->
  <g transform="translate(850, 240)">
    <ellipse cx="60" cy="50" rx="35" ry="12" fill="#ff0000" filter="url(#horrorGlow)" />
    <circle cx="60" cy="50" r="6" fill="#ffffff" />
    
    <ellipse cx="180" cy="50" rx="35" ry="12" fill="#ff0000" filter="url(#horrorGlow)" />
    <circle cx="180" cy="50" r="6" fill="#ffffff" />

    <!-- Distorted silhouette face -->
    <path d="M 20,-40 Q 120,-80 220,-40 Q 260,140 210,220 Q 120,260 30,220 Z" fill="#050000" opacity="0.9" stroke="#ff0000" stroke-width="1.5" />
    
    <!-- Creepy Smile -->
    <path d="M 50,140 Q 120,200 190,140" stroke="#ff0000" stroke-width="6" fill="none" filter="url(#horrorGlow)" />
  </g>

  <!-- Big Blood Red Horror Typography Left -->
  <g transform="translate(80, 180)">
    <rect x="0" y="-70" width="260" height="42" rx="6" fill="#ff0000" opacity="0.2" stroke="#ff0000" stroke-width="1" />
    <text x="130" y="-42" fill="#ff3333" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">⚠️ DO NOT WATCH ALONE</text>

    <text x="0" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="82" font-weight="900" stroke="#000000" stroke-width="12" paint-order="stroke fill" letter-spacing="-1">
      3:00 AM IN THE
    </text>
    
    <text x="0" y="145" fill="url(#blood-grad)" font-family="Inter, sans-serif" font-size="100" font-weight="900" stroke="#000000" stroke-width="16" paint-order="stroke fill" filter="url(#horrorGlow)" letter-spacing="1">
      ABANDONED ASYLUM
    </text>

    <text x="0" y="225" fill="#ff6666" font-family="Inter, sans-serif" font-size="38" font-weight="800" stroke="#000000" stroke-width="6" paint-order="stroke fill">
      (WE FOUND SOMETHING TERRIFYING)
    </text>
  </g>

  <!-- Flashlight beam overlay -->
  <polygon points="100,720 700,240 1000,240 400,720" fill="#ffffff" opacity="0.04" />

  <!-- Cam Recording Indicator -->
  <g transform="translate(80, 600)">
    <circle cx="20" cy="20" r="10" fill="#ff0000" />
    <text x="45" y="27" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="800">REC · REAL FOOTAGE</text>
  </g>
</svg>
