<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <radialGradient id="h2-spot" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1f1035" />
      <stop offset="50%" stop-color="#0e071c" />
      <stop offset="100%" stop-color="#020008" />
    </radialGradient>
    <linearGradient id="purple-blood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e02424" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#h2-spot)" />

  <!-- Moon / Eerie Light -->
  <circle cx="950" cy="220" r="160" fill="#a855f7" opacity="0.15" filter="blur(40px)" />
  <circle cx="950" cy="220" r="90" fill="#e9d5ff" opacity="0.8" />
  
  <!-- Silhouette Forest & Spooky Mansion -->
  <polygon points="750,720 820,400 870,440 920,360 970,420 1020,380 1100,720" fill="#030108" />
  <polygon points="600,720 660,480 720,520 780,450 840,720" fill="#090412" />

  <!-- Fog Layers -->
  <rect x="0" y="550" width="1280" height="170" fill="#120824" opacity="0.7" filter="blur(20px)" />

  <!-- Ghostly apparition figure -->
  <path d="M 940,300 Q 920,420 950,540 Q 980,420 960,300 Z" fill="#ffffff" opacity="0.3" filter="blur(8px)" />
  <circle cx="945" cy="330" r="4" fill="#ff0000" />
  <circle cx="955" cy="330" r="4" fill="#ff0000" />

  <!-- Big Bold Typography Left -->
  <g transform="translate(80, 200)">
    <rect x="-10" y="-80" width="300" height="46" rx="8" fill="#a855f7" opacity="0.3" stroke="#a855f7" stroke-width="1.5" />
    <text x="140" y="-50" fill="#f3e8ff" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">PARANORMAL INVESTIGATION</text>

    <text x="0" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="80" font-weight="900" stroke="#000000" stroke-width="12" paint-order="stroke fill" letter-spacing="-1">
      THE CURSED HOUSE
    </text>
    
    <text x="0" y="145" fill="url(#purple-blood)" font-family="Inter, sans-serif" font-size="94" font-weight="900" stroke="#000000" stroke-width="16" paint-order="stroke fill">
      NO ONE SURVIVED!
    </text>

    <text x="0" y="225" fill="#c084fc" font-family="Inter, sans-serif" font-size="36" font-weight="800" stroke="#000000" stroke-width="6" paint-order="stroke fill">
      CAUGHT ON NIGHT VISION CAMERA 👁️
    </text>
  </g>

  <!-- EMF Meter Box -->
  <g transform="translate(80, 560)">
    <rect width="320" height="75" rx="16" fill="#090412" stroke="#e02424" stroke-width="2" />
    <text x="24" y="32" fill="#888899" font-family="Inter, sans-serif" font-size="12" font-weight="700">GHOST FREQUENCY</text>
    <text x="24" y="58" fill="#e02424" font-family="Inter, sans-serif" font-size="22" font-weight="900">⚠️ LEVEL 5 CRITICAL</text>
  </g>
</svg>
